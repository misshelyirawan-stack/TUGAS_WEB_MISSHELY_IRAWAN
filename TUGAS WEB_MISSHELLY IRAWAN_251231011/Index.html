<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyek Web Interaktif - Tugas JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Header / Banner -->
        <header class="header-card">
            <h1 id="greeting">Selamat Datang!</h1>
            <p id="subtext">Silakan isi formulir pendaftaran di bawah ini.</p>
            
            <!-- Fitur DOM 1: Mengubah Tema Warna Background Header -->
            <div class="theme-switch">
                <span>Pilih Tema Card:</span>
                <button id="btnThemeNavy" class="btn-sm">Navy</button>
                <button id="btnThemeDark" class="btn-sm">Dark</button>
                <button id="btnThemeAccent" class="btn-sm">Accent</button>
            </div>
        </header>

        <!-- Form Validation -->
        <main class="form-card">
            <h2>Form Registrasi</h2>
            <form id="registrationForm" novalidate>
                
                <!-- Field Nama -->
                <div class="form-group">
                    <label for="fullName">Nama Lengkap</label>
                    <input type="text" id="fullName" placeholder="Masukkan nama lengkap...">
                    <small class="error-message" id="nameError"></small>
                </div>

                <!-- Field Email -->
                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input type="email" id="email" placeholder="contoh: misshely@domain.com">
                    <small class="error-message" id="emailError"></small>
                </div>

                <!-- Field Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Minimal 8 karakter">
                    <!-- Real-time Event Indicator (keyup) -->
                    <small class="hint-text" id="passwordHint">Panjang password: 0 karakter</small>
                    <small class="error-message" id="passwordError"></small>
                </div>

                <!-- Tombol Submit -->
                <button type="submit" id="btnSubmit">Daftar Sekarang</button>
            </form>

            <!-- Pesan Sukses -->
            <div id="successBanner" class="success-banner hidden">
                <h3>🎉 Registrasi Berhasil!</h3>
                <p id="successMessage"></p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
